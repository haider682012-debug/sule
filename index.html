<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarChess</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #151923;
      color: white;
      text-align: center;
      padding: 30px 12px;
    }
    h1 { color: #81c784; }
    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: min(90vw, 480px);
      aspect-ratio: 1;
      margin: 24px auto;
      border: 4px solid #303846;
    }
    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(20px, 7vw, 42px);
      cursor: pointer;
      user-select: none;
    }
    .light { background: #eeeed2; }
    .dark { background: #769656; }
    .selected { background: #f6f669; }
    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    #status { color: #d4d8e0; }
  </style>
</head>
<body>
  <h1>♟ DarChess</h1>
  <p>Website catur pertamaku!</p>
  <div id="board" class="board"></div>
  <p id="status">Giliran Putih</p>
  <button onclick="resetBoard()">Mulai Ulang</button>

  <script>
    const start = [
      "♜♞♝♛♚♝♞♜",
      "♟♟♟♟♟♟♟♟",
      "        ",
      "        ",
      "        ",
      "        ",
      "♙♙♙♙♙♙♙♙",
      "♖♘♗♕♔♗♘♖"
    ];

    let board, selected = null, whiteTurn = true;

    function resetBoard() {
      board = start.map(row => [...row]);
      selected = null;
      whiteTurn = true;
      draw();
    }

    function draw() {
      const el = document.getElementById("board");
      el.innerHTML = "";
      board.forEach((row, r) => row.forEach((piece, c) => {
        const sq = document.createElement("div");
        sq.className = "square " +
          ((r + c) % 2 ? "dark" : "light") +
          (selected && selected[0] === r &&
           selected[1] === c ? " selected" : "");
        sq.textContent = piece.trim();
        sq.onclick = () => clickSquare(r, c);
        el.appendChild(sq);
      }));
      document.getElementById("status").textContent =
        "Giliran " + (whiteTurn ? "Putih" : "Hitam");
    }

    function clickSquare(r, c) {
      const p = board[r][c];
      if (selected) {
        const [sr, sc] = selected;
        if (sr === r && sc === c) {
          selected = null;
        } else if (p.trim() &&
          (whiteTurn ? "♙♖♘♗♕♔" : "♟♜♞♝♛♚")
            .includes(p)) {
          selected = [r, c];
        } else {
          board[r][c] = board[sr][sc];
          board[sr][sc] = " ";
          selected = null;
          whiteTurn = !whiteTurn;
        }
      } else if (p.trim() &&
        (whiteTurn ? "♙♖♘♗♕♔" : "♟♜♞♝♛♚")
          .includes(p)) {
        selected = [r, c];
      }
      draw();
    }

    resetBoard();
  </script>
</body>
</html>
